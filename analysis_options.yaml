include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Nenhum log pode imprimir chaves ou respostas do usuário.
    avoid_print: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - avoid_print
    - prefer_final_locals
