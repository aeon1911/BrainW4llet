name: brainw4llet
description: "Carteira cripto stateless e multiplataforma com derivação de chaves via Argon2id."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Versões EXATAS nos pacotes criptográficos (ver docs/AVALIACAO_SEGURANCA.md §6).
  # libsodium 1.0.22 compilada do código-fonte assinado embutido no pacote:
  # Argon2id, CSPRNG e memória protegida (SecureKey).
  sodium: 4.1.2
  # BIP-39/32/44, secp256k1, endereços. Dart puro, sem dependências.
  blockchain_utils: 7.1.0
  # Decomposição Unicode (NFKD/NFC) para normalização das respostas.
  unorm_dart: 0.3.3
  meta: ^1.15.0
  bitcoin_base: 7.3.0
  on_chain: 8.1.0
  file_selector: 1.1.0
  monero_dart: 1.7.0
  path_provider: 2.1.6
  # Gera o QR do endereço de recebimento (Dart puro, sem rede).
  qr: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Fontes embutidas (OFL): o assinador frio nunca baixa nada.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
